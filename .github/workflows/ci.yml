# Build every target with the pinned toolchain and check each library against
# the declared interface and frame rules, then on each of the 7 supported
# targets run every vector file and go-ethereum's discv5 conformance suite,
# and write the tick tables (ARCHITECTURE.md sections 1, 4, 7 and 10).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - name: Generate vectors
        run: tests/generator/run.sh "$RUNNER_TEMP/vectors"
      - name: Build the devp2p conformance tool
        run: tests/conformance/build-devp2p.sh "$RUNNER_TEMP/devp2p"
      - name: Build and check all targets
        run: |
          docker build -t asm-discv5-build -f platform/linux/Dockerfile platform/linux
          docker run --rm -v "$PWD:/src" -w /src asm-discv5-build platform/build-all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build
          path: |
            build/
            !build/deps/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vectors
          path: ${{ runner.temp }}/vectors/*.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: devp2p
          path: ${{ runner.temp }}/devp2p/devp2p-*

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64,  runs-on: ubuntu-24.04,     qemu: "",           devp2p: devp2p-linux-amd64 }
          - { isa: arm64,   runs-on: ubuntu-24.04-arm, qemu: "",           devp2p: devp2p-linux-arm64 }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64, devp2p: devp2p-linux-arm64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: devp2p, path: devp2p }
      - if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run vectors
        run: |
          set -o pipefail
          chmod +x build/linux-${{ matrix.isa }}/runner build/linux-${{ matrix.isa }}/node devp2p/*
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/runner vectors | tee results-linux-${{ matrix.isa }}.txt
      - name: Run the conformance suite
        run: |
          set -o pipefail
          tests/conformance/run.sh devp2p/${{ matrix.devp2p }} build/linux-${{ matrix.isa }}/node 127.0.0.2 ${{ matrix.qemu }} \
            | tee -a results-linux-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-linux-${{ matrix.isa }}
          path: results-linux-${{ matrix.isa }}.txt

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: windows-2025,   devp2p: devp2p-windows-amd64.exe }
          - { isa: arm64,  runs-on: windows-11-arm, devp2p: devp2p-windows-arm64.exe }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: devp2p, path: devp2p }
      - name: Run vectors
        shell: pwsh
        run: |
          & "build/windows-${{ matrix.isa }}/runner.exe" vectors | Tee-Object results-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the conformance suite
        shell: bash
        run: |
          set -o pipefail
          tests/conformance/run.sh devp2p/${{ matrix.devp2p }} build/windows-${{ matrix.isa }}/node.exe 127.0.0.1 \
            | tee -a results-windows-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-windows-${{ matrix.isa }}
          path: results-windows-${{ matrix.isa }}.txt

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: macos-15-intel, devp2p: devp2p-darwin-amd64 }
          - { isa: arm64,  runs-on: macos-15,       devp2p: devp2p-darwin-arm64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: devp2p, path: devp2p }
      - name: Run vectors
        run: |
          set -o pipefail
          tests/runner/macos.sh vectors | tee results-macos-${{ matrix.isa }}.txt
      - name: Run the conformance suite
        run: |
          set -o pipefail
          chmod +x devp2p/*
          tests/conformance/run.sh devp2p/${{ matrix.devp2p }} build/macos-${{ matrix.isa }}/node 127.0.0.1 \
            | tee -a results-macos-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-macos-${{ matrix.isa }}
          path: results-macos-${{ matrix.isa }}.txt

  # Write the tick tables into docs/reference/ from the results of every target.
  # On a push to main, commit them when they changed. When main has moved on,
  # the push is skipped: the newer run writes the tables then.
  results:
    needs: [build, linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { pattern: results-*, path: results, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { name: build, path: build }
      - name: Write the tick tables
        run: python3 -I tests/runner/tick_tables.py results build
      - name: Write the verification heatmap
        run: python3 -I tests/runner/heatmap.py
      - name: Write the README panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | tojson' > "$RUNNER_TEMP/jobs.jsonl"
          python3 -I tests/runner/panels.py "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.jsonl"
      - name: Commit the tick tables and README panels
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/reference docs/heatmap docs/readme README.md
          if git diff --cached --quiet; then echo "The tick tables and README panels did not change."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update the tick tables and README panels"
          if ! git push origin HEAD:main; then
            [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ] || exit 1
            echo "main has moved on, so this run does not update the tick tables or README panels."
          fi
